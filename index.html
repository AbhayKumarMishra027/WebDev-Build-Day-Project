<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quote Saver Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>📝 Quote Saver</h1>

    <!-- Cat Poster Image -->
    <div class="cat-img">
        <img src="Cat_horizontal.png" alt="Motivation Cat">
    </div>

    <div class="input-area">
        <input type="text" id="quoteInput" placeholder="Write your quote...">
        <button id="saveBtn">Save</button>
    </div>

    <div class="action-btns">
        <button id="randomBtn">🎲 Random</button>
        <button id="clearAllBtn">🗑️ Clear All</button>
    </div>

    <h2>Saved Quotes</h2>
    <ul id="quotesList"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
